<svg viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
  <title>魅力钻石模型</title>
  <desc>展示人格魅力的三个核心维度：内核、能量场和外显</desc>
  
  <!-- Main diamond shape -->
  <g id="diamond-shape">
    <!-- Diamond outline -->
    <path d="M 200 50 L 320 125 L 200 300 L 80 125 Z" 
          fill="none" stroke="#333333" stroke-width="1.5"/>
    
    <!-- Internal divisions -->
    <line x1="200" y1="50" x2="200" y2="300" stroke="#999999" stroke-width="0.5"/>
    <line x1="80" y1="125" x2="320" y2="125" stroke="#999999" stroke-width="0.5"/>
    <line x1="200" y1="50" x2="80" y2="125" stroke="#999999" stroke-width="0.5"/>
    <line x1="200" y1="50" x2="320" y2="125" stroke="#999999" stroke-width="0.5"/>
  </g>
  
  <!-- Core: 人格特质 -->
  <g id="core-section">
    <text x="200" y="90" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333">内核</text>
    <text x="200" y="105" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="300" fill="#666666">积极人格特质</text>
    
    <!-- Core traits -->
    <circle cx="160" cy="120" r="3" fill="#666666"/>
    <text x="145" y="123" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">善良</text>
    
    <circle cx="200" cy="115" r="3" fill="#666666"/>
    <text x="200" y="108" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">真诚</text>
    
    <circle cx="240" cy="120" r="3" fill="#666666"/>
    <text x="255" y="123" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">乐观</text>
  </g>
  
  <!-- Aura: 情绪智能 -->
  <g id="aura-section">
    <!-- Left aura -->
    <text x="140" y="175" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#333333">能量场</text>
    <text x="140" y="190" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">情绪智能</text>
    
    <text x="120" y="205" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">自我觉察</text>
    <text x="120" y="215" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">情绪管理</text>
    
    <!-- Right aura -->
    <text x="260" y="175" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#333333">能量场</text>
    <text x="260" y="190" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">情绪智能</text>
    
    <text x="280" y="205" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">社会意识</text>
    <text x="280" y="215" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">关系管理</text>
  </g>
  
  <!-- Expression: 社交风采 -->
  <g id="expression-section">
    <text x="200" y="250" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#333333">外显</text>
    <text x="200" y="265" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">社交风采</text>
    
    <!-- Expression elements -->
    <text x="160" y="280" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">沟通技巧</text>
    <text x="200" y="280" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">仪态举止</text>
    <text x="240" y="280" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">幽默表达</text>
  </g>
  
  <!-- Connecting relationships -->
  <g id="relationships">
    <!-- Bidirectional arrows showing integration -->
    <path d="M 170 110 Q 140 140 150 170" stroke="#999999" stroke-width="0.5" fill="none" marker-end="url(#small-arrow)"/>
    <path d="M 230 110 Q 260 140 250 170" stroke="#999999" stroke-width="0.5" fill="none" marker-end="url(#small-arrow)"/>
    <path d="M 150 200 Q 170 220 180 240" stroke="#999999" stroke-width="0.5" fill="none" marker-end="url(#small-arrow)"/>
    <path d="M 250 200 Q 230 220 220 240" stroke="#999999" stroke-width="0.5" fill="none" marker-end="url(#small-arrow)"/>
  </g>
  
  <!-- Title and subtitle -->
  <g id="title-section">
    <text x="200" y="25" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#333333">魅力钻石模型</text>
    <text x="200" y="320" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="300" fill="#666666">人格魅力 = 积极特质 × 情绪智能 × 社交风采</text>
  </g>
  
  <!-- Integration indicators -->
  <g id="integration-points">
    <circle cx="200" cy="125" r="2" fill="#333333"/>
    <circle cx="200" cy="175" r="2" fill="#333333"/>
    <circle cx="200" cy="225" r="2" fill="#333333"/>
  </g>
  
  <!-- Subtle decorative elements -->
  <g id="decorative-elements">
    <circle cx="60" cy="40" r="1" fill="#999999" opacity="0.4"/>
    <circle cx="340" cy="40" r="1" fill="#999999" opacity="0.4"/>
    <circle cx="60" cy="310" r="1" fill="#999999" opacity="0.4"/>
    <circle cx="340" cy="310" r="1" fill="#999999" opacity="0.4"/>
  </g>
  
  <!-- Define arrow marker -->
  <defs>
    <marker id="small-arrow" markerWidth="8" markerHeight="6" 
            refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999999"/>
    </marker>
  </defs>
  
  <!-- Animated center point -->
  <g id="center-animation">
    <circle cx="200" cy="175" r="1.5" fill="#333333">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>