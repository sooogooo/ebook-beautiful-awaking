<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <title>积极决策理论框架</title>
  <desc>展示理性美丽决策的六步流程</desc>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="300" fill="#333333">积极决策理论框架</text>
  <text x="250" y="45" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="300" fill="#666666">理性美丽决策六步法</text>
  
  <!-- Step 1: 需求识别 -->
  <g id="step1">
    <rect x="50" y="80" width="100" height="60" fill="none" stroke="#333333" stroke-width="1" rx="4"/>
    <text x="100" y="105" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">需求识别</text>
    <text x="100" y="120" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">明确真实需求</text>
    <text x="100" y="130" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">动机分析</text>
  </g>
  
  <!-- Arrow 1->2 -->
  <path d="M 150 110 L 180 110" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 2: 信息收集 -->
  <g id="step2">
    <rect x="180" y="80" width="100" height="60" fill="none" stroke="#333333" stroke-width="1" rx="4"/>
    <text x="230" y="105" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">信息收集</text>
    <text x="230" y="120" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">科学知识</text>
    <text x="230" y="130" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">专业咨询</text>
  </g>
  
  <!-- Arrow 2->3 -->
  <path d="M 280 110 L 310 110" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 3: 方案评估 -->
  <g id="step3">
    <rect x="310" y="80" width="100" height="60" fill="none" stroke="#333333" stroke-width="1" rx="4"/>
    <text x="360" y="105" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">方案评估</text>
    <text x="360" y="120" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">风险收益</text>
    <text x="360" y="130" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">可行性分析</text>
  </g>
  
  <!-- Arrow 3->4 (curved down) -->
  <path d="M 360 140 L 360 170" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 4: 决策制定 -->
  <g id="step4">
    <rect x="310" y="170" width="100" height="60" fill="none" stroke="#333333" stroke-width="1" rx="4"/>
    <text x="360" y="195" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">决策制定</text>
    <text x="360" y="210" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">理性选择</text>
    <text x="360" y="220" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">价值排序</text>
  </g>
  
  <!-- Arrow 4->5 -->
  <path d="M 310 200 L 280 200" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 5: 行动执行 -->
  <g id="step5">
    <rect x="180" y="170" width="100" height="60" fill="none" stroke="#333333" stroke-width="1" rx="4"/>
    <text x="230" y="195" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">行动执行</text>
    <text x="230" y="210" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">计划实施</text>
    <text x="230" y="220" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">过程管理</text>
  </g>
  
  <!-- Arrow 5->6 -->
  <path d="M 180 200 L 150 200" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 6: 效果评估 -->
  <g id="step6">
    <rect x="50" y="170" width="100" height="60" fill="none" stroke="#333333" stroke-width="1" rx="4"/>
    <text x="100" y="195" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">效果评估</text>
    <text x="100" y="210" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">结果反馈</text>
    <text x="100" y="220" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">经验总结</text>
  </g>
  
  <!-- Feedback loop (6->1) -->
  <path d="M 100 170 Q 30 125 50 110" stroke="#999999" stroke-width="0.5" fill="none" stroke-dasharray="2,2" marker-end="url(#arrow-dashed)"/>
  <text x="25" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">反馈循环</text>
  
  <!-- Core principles box -->
  <g id="principles">
    <rect x="150" y="270" width="200" height="80" fill="none" stroke="#999999" stroke-width="0.5" rx="3"/>
    <text x="250" y="290" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="300" fill="#666666">核心原则</text>
    
    <text x="160" y="305" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">• 积极导向：关注优势而非缺陷</text>
    <text x="160" y="318" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">• 科学理性：基于证据和逻辑</text>
    <text x="160" y="331" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">• 价值驱动：符合内在价值观</text>
    <text x="160" y="344" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">• 长期视角：考虑持续影响</text>
  </g>
  
  <!-- Connection from principles to process -->
  <path d="M 250 270 L 250 230" stroke="#999999" stroke-width="0.5" stroke-dasharray="1,2"/>
  
  <!-- Side annotations -->
  <g id="annotations">
    <!-- Cognitive biases warning -->
    <rect x="440" y="100" width="50" height="40" fill="none" stroke="#999999" stroke-width="0.5" rx="2"/>
    <text x="465" y="115" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">注意</text>
    <text x="465" y="125" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">认知偏见</text>
    <text x="465" y="135" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">陷阱</text>
    
    <!-- Connection line -->
    <path d="M 410 120 L 440 120" stroke="#999999" stroke-width="0.5" stroke-dasharray="1,1"/>
  </g>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="6" 
            refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999999"/>
    </marker>
  </defs>
  
  <!-- Progress indicator -->
  <g id="progress">
    <circle cx="100" cy="110" r="2" fill="#333333"/>
    <circle cx="230" cy="110" r="2" fill="#333333"/>
    <circle cx="360" cy="110" r="2" fill="#333333"/>
    <circle cx="360" cy="200" r="2" fill="#333333"/>
    <circle cx="230" cy="200" r="2" fill="#333333"/>
    <circle cx="100" cy="200" r="2" fill="#333333"/>
  </g>
</svg>