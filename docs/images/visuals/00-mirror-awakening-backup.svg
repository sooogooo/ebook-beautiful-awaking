<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="#f8f9fa"/>
  
  <!-- Mirror frame -->
  <rect x="50" y="50" width="200" height="250" fill="none" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Mirror surface -->
  <rect x="55" y="55" width="190" height="240" fill="#e8f4f8"/>
  
  <!-- Reflection ellipse -->
  <ellipse cx="150" cy="175" rx="60" ry="80" fill="none" stroke="#74c0fc" stroke-width="2" opacity="0.7"/>
  
  <!-- Simple figure -->
  <circle cx="150" cy="120" r="12" fill="#495057"/>
  <path d="M 150 132 L 150 155 M 135 140 L 165 140 M 135 155 L 135 180 M 165 155 L 165 180" 
        stroke="#495057" stroke-width="3" fill="none"/>
  
  <!-- Corner decorations -->
  <circle cx="50" cy="50" r="4" fill="#2c3e50"/>
  <circle cx="250" cy="50" r="4" fill="#2c3e50"/>
  <circle cx="50" cy="300" r="4" fill="#2c3e50"/>
  <circle cx="250" cy="300" r="4" fill="#2c3e50"/>
  
  <!-- Sparkles -->
  <circle cx="30" cy="30" r="3" fill="#ffd43b"/>
  <circle cx="270" cy="35" r="3" fill="#ffd43b"/>
  <circle cx="35" cy="200" r="3" fill="#ffd43b"/>
  <circle cx="265" cy="220" r="3" fill="#ffd43b"/>
  
  <!-- Title -->
  <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">爱美之心的觉醒</text>
  
  <!-- Subtitle -->
  <text x="150" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#495057">在进化与美学的交汇处，发现爱美之心的真相</text>
</svg>