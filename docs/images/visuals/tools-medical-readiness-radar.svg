<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <title>医美准备度评估雷达图</title>
  <desc>评估个体进行医美的心理准备程度的五个维度</desc>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="300" fill="#333333">医美准备度评估</text>
  <text x="200" y="45" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">五维度心理评估工具</text>
  
  <!-- Pentagon grid background -->
  <g id="radar-grid">
    <!-- Center point -->
    <circle cx="200" cy="200" r="2" fill="#999999"/>
    
    <!-- Pentagon levels -->
    <polygon points="200,120 260,160 240,220 160,220 140,160" 
             fill="none" stroke="#f0f0f0" stroke-width="1"/>
    <polygon points="200,140 245,170 230,210 170,210 155,170" 
             fill="none" stroke="#e0e0e0" stroke-width="1"/>
    <polygon points="200,160 230,180 220,200 180,200 170,180" 
             fill="none" stroke="#d0d0d0" stroke-width="1"/>
    <polygon points="200,180 215,190 210,190 190,190 185,190" 
             fill="none" stroke="#c0c0c0" stroke-width="1"/>
    
    <!-- Main pentagon -->
    <polygon points="200,100 280,150 260,250 140,250 120,150" 
             fill="none" stroke="#999999" stroke-width="1"/>
    
    <!-- Radial lines -->
    <line x1="200" y1="200" x2="200" y2="100" stroke="#e0e0e0" stroke-width="0.5"/>
    <line x1="200" y1="200" x2="280" y2="150" stroke="#e0e0e0" stroke-width="0.5"/>
    <line x1="200" y1="200" x2="260" y2="250" stroke="#e0e0e0" stroke-width="0.5"/>
    <line x1="200" y1="200" x2="140" y2="250" stroke="#e0e0e0" stroke-width="0.5"/>
    <line x1="200" y1="200" x2="120" y2="150" stroke="#e0e0e0" stroke-width="0.5"/>
  </g>
  
  <!-- Data polygon (example scores) -->
  <g id="data-polygon">
    <polygon points="200,130 270,155 250,230 150,235 135,160" 
             fill="none" stroke="#333333" stroke-width="1.5" fill="#f5f5f5" fill-opacity="0.3"/>
    
    <!-- Data points -->
    <circle cx="200" cy="130" r="3" fill="#333333"/>
    <circle cx="270" cy="155" r="3" fill="#333333"/>
    <circle cx="250" cy="230" r="3" fill="#333333"/>
    <circle cx="150" cy="235" r="3" fill="#333333"/>
    <circle cx="135" cy="160" r="3" fill="#333333"/>
  </g>
  
  <!-- Dimension labels -->
  <g id="dimension-labels">
    <!-- Motivation -->
    <text x="200" y="90" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="400" fill="#333333">动机评估</text>
    <text x="200" y="78" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">内部驱动</text>
    
    <!-- Knowledge -->
    <text x="300" y="150" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="400" fill="#333333">知识准备</text>
    <text x="300" y="162" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">信息充分</text>
    
    <!-- Psychology -->
    <text x="280" y="270" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="400" fill="#333333">心理状态</text>
    <text x="280" y="282" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">情绪稳定</text>
    
    <!-- Support -->
    <text x="120" y="270" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="400" fill="#333333">社会支持</text>
    <text x="120" y="282" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">环境友好</text>
    
    <!-- Expectation -->
    <text x="100" y="150" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="400" fill="#333333">期望管理</text>
    <text x="100" y="162" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">现实合理</text>
  </g>
  
  <!-- Scale indicators -->
  <g id="scale-indicators">
    <text x="185" y="120" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">高</text>
    <text x="185" y="185" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">中</text>
    <text x="185" y="235" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">低</text>
  </g>
  
  <!-- Score display -->
  <g id="score-display">
    <rect x="150" y="320" width="100" height="40" fill="none" stroke="#999999" stroke-width="0.5" rx="3"/>
    <text x="200" y="335" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">综合评分</text>
    <text x="200" y="350" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333">76/100</text>
  </g>
  
  <!-- Interpretation guide -->
  <g id="interpretation">
    <rect x="20" y="320" width="120" height="40" fill="none" stroke="#999999" stroke-width="0.5" rx="3"/>
    <text x="80" y="335" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#666666">评估结果</text>
    <text x="80" y="350" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="400" fill="#333333">基本准备充分</text>
  </g>
  
  <g id="recommendation">
    <rect x="260" y="320" width="120" height="40" fill="none" stroke="#999999" stroke-width="0.5" rx="3"/>
    <text x="320" y="335" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#666666">建议</text>
    <text x="320" y="350" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="400" fill="#333333">可以考虑进行</text>
  </g>
  
  <!-- Risk indicators -->
  <g id="risk-indicators">
    <!-- Low risk zone -->
    <polygon points="200,160 230,180 220,200 180,200 170,180" 
             fill="none" stroke="#99cc99" stroke-width="0.5" stroke-dasharray="2,1"/>
    <text x="200" y="190" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">低风险区</text>
    
    <!-- High risk zone -->
    <polygon points="200,240 260,250 240,250 140,250 120,250" 
             fill="none" stroke="#cc9999" stroke-width="0.5" stroke-dasharray="2,1"/>
    <text x="200" y="260" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">高风险区</text>
  </g>
  
  <!-- Interactive hints -->
  <g id="hints">
    <text x="200" y="380" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="300" fill="#999999">
      点击各维度查看详细评估标准
    </text>
  </g>
</svg>