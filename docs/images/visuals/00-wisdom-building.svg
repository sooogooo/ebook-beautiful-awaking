<svg viewBox="0 0 200 500" xmlns="http://www.w3.org/2000/svg">
  <title>智慧大厦</title>
  <desc>从基础心理学到美的升华的四层成长结构</desc>
  
  <!-- Title -->
  <text x="100" y="25" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="300" fill="#333333">智慧大厦</text>
  <text x="100" y="40" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">四层成长结构</text>
  
  <!-- Building structure with elegant lines -->
  <!-- Floor 4: 升华 -->
  <rect x="40" y="60" width="120" height="80" fill="none" stroke="#333333" stroke-width="1" rx="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">第四部分</text>
  <text x="100" y="98" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">美的升华</text>
  <text x="100" y="110" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">社会价值 • 内外整合</text>
  <text x="100" y="120" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">未来展望</text>
  
  <!-- Floor 3: 实践 -->
  <rect x="40" y="140" width="120" height="80" fill="none" stroke="#333333" stroke-width="1" rx="2"/>
  <text x="100" y="165" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">第三部分</text>
  <text x="100" y="178" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">实践的智慧</text>
  <text x="100" y="190" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">新手指南 • 咨询师成长</text>
  <text x="100" y="200" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">进阶策略</text>
  
  <!-- Floor 2: 理性 -->
  <rect x="40" y="220" width="120" height="80" fill="none" stroke="#333333" stroke-width="1" rx="2"/>
  <text x="100" y="245" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">第二部分</text>
  <text x="100" y="258" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">理性的美丽</text>
  <text x="100" y="270" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">美丽科学 • 决策理论</text>
  <text x="100" y="280" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">个体化美学</text>
  
  <!-- Floor 1: 心理学 -->
  <rect x="40" y="300" width="120" height="80" fill="none" stroke="#333333" stroke-width="1" rx="2"/>
  <text x="100" y="325" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="400" fill="#333333">第一部分</text>
  <text x="100" y="338" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">美的心理学</text>
  <text x="100" y="350" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">进化心理学 • 自我建构</text>
  <text x="100" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999">消费心理学</text>
  
  <!-- Central elevator with connection -->
  <line x1="100" y1="60" x2="100" y2="380" stroke="#666666" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="3" fill="#333333"/>
  <circle cx="100" cy="180" r="3" fill="#333333"/>
  <circle cx="100" cy="260" r="3" fill="#333333"/>
  <circle cx="100" cy="340" r="3" fill="#333333"/>
  <text x="115" y="225" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999" transform="rotate(-90 115 225)">整合成长路径</text>
  
  <!-- Side arrows indicating progression -->
  <path d="M 25 70 L 25 370" stroke="#999999" stroke-width="0.5" fill="none"/>
  <path d="M 175 370 L 175 70" stroke="#999999" stroke-width="0.5" fill="none"/>
  
  <!-- Arrow heads -->
  <path d="M 25 370 L 23 367 L 27 367 Z" fill="#999999"/>
  <path d="M 175 70 L 173 67 L 177 67 Z" fill="#999999"/>
  
  <!-- Side labels -->
  <text x="20" y="225" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999" transform="rotate(-90 20 225)">基础</text>
  <text x="180" y="225" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="6" font-weight="300" fill="#999999" transform="rotate(90 180 225)">升华</text>
  
  <!-- Connection arrows between floors -->
  <path d="M 100 140 L 100 150" stroke="#333333" stroke-width="1" fill="none"/>
  <path d="M 100 220 L 100 230" stroke="#333333" stroke-width="1" fill="none"/>
  <path d="M 100 300 L 100 310" stroke="#333333" stroke-width="1" fill="none"/>
  
  <!-- Elegant divider -->
  <line x1="30" y1="420" x2="170" y2="420" stroke="#999999" stroke-width="0.5"/>
  
  <!-- Bottom text -->
  <text x="100" y="450" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">从基础心理学到美的升华</text>
  <text x="100" y="465" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="300" fill="#666666">四层成长结构</text>
  
  <!-- Subtle corner decorations -->
  <circle cx="35" cy="65" r="1" fill="#999999" opacity="0.6"/>
  <circle cx="165" cy="65" r="1" fill="#999999" opacity="0.6"/>
  <circle cx="35" cy="375" r="1" fill="#999999" opacity="0.6"/>
  <circle cx="165" cy="375" r="1" fill="#999999" opacity="0.6"/>
</svg>