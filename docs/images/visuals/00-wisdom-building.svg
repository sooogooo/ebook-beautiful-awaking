<svg viewBox="0 0 200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="300" fill="#333">智慧大厦</text>
  <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">四层成长结构</text>
  
  <!-- Building structure with elegant lines -->
  <!-- Floor 4: 升华 -->
  <rect x="40" y="60" width="120" height="80" fill="none" stroke="#333" stroke-width="0.5"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">第四部分</text>
  <text x="100" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">美的升华</text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">社会价值 • 内外整合</text>
  <text x="100" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">未来展望</text>
  
  <!-- Floor 3: 实践 -->
  <rect x="40" y="140" width="120" height="80" fill="none" stroke="#333" stroke-width="0.5"/>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">第三部分</text>
  <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">实践的智慧</text>
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">新手指南 • 咨询师成长</text>
  <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">进阶策略</text>
  
  <!-- Floor 2: 理性 -->
  <rect x="40" y="220" width="120" height="80" fill="none" stroke="#333" stroke-width="0.5"/>
  <text x="100" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">第二部分</text>
  <text x="100" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">理性的美丽</text>
  <text x="100" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">美丽科学 • 决策理论</text>
  <text x="100" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">个体化美学</text>
  
  <!-- Floor 1: 心理学 -->
  <rect x="40" y="300" width="120" height="80" fill="none" stroke="#333" stroke-width="0.5"/>
  <text x="100" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">第一部分</text>
  <text x="100" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">美的心理学</text>
  <text x="100" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">进化心理学 • 自我建构</text>
  <text x="100" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999">消费心理学</text>
  
  <!-- Central elevator -->
  <line x1="100" y1="60" x2="100" y2="380" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#999" transform="rotate(-90 100 225)">整合成长</text>
  
  <!-- Side arrows -->
  <path d="M 25 70 L 25 370" stroke="#ccc" stroke-width="0.5" fill="none"/>
  <path d="M 175 370 L 175 70" stroke="#ccc" stroke-width="0.5" fill="none"/>
  
  <!-- Arrow heads -->
  <path d="M 25 370 L 23 367 L 27 367 Z" fill="#ccc"/>
  <path d="M 175 70 L 173 67 L 177 67 Z" fill="#ccc"/>
  
  <!-- Side labels -->
  <text x="20" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999" transform="rotate(-90 20 225)">基础</text>
  <text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#999" transform="rotate(90 180 225)">升华</text>
  
  <!-- Elegant divider -->
  <line x1="30" y1="420" x2="170" y2="420" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- Bottom text -->
  <text x="100" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">从基础心理学到美的升华</text>
  <text x="100" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">四层成长结构</text>
  
  <!-- Subtle corner decorations -->
  <circle cx="35" cy="65" r="1" fill="#999" opacity="0.4"/>
  <circle cx="165" cy="65" r="1" fill="#999" opacity="0.4"/>
  <circle cx="35" cy="375" r="1" fill="#999" opacity="0.4"/>
  <circle cx="165" cy="375" r="1" fill="#999" opacity="0.4"/>
</svg>